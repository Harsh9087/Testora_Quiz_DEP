
name: Deploy TestoraQuiz to BigRock VPS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testora-quiz-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy TestoraQuiz
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Populate known_hosts safely with fallback
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts || true

          ssh -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -eu

          cd /var/www/testora-quiz

          # Safely reset any local tracked discrepancies and align with origin/main
          git fetch origin main
          git reset --hard origin/main

          # Preserve the expected backend port mapping.
          grep -Fq '"8001:8000"' docker-compose.yml || {
            echo "ERROR: Expected backend port mapping 8001:8000 not found."
            exit 1
          }

          # Verify Compose configuration before changing containers.
          docker compose config -q

          # Rebuild and update only TestoraQuiz services.
          docker compose build backend frontend
          docker compose up -d --no-deps backend frontend

          # Verify container state and HTTP responses.
          docker compose ps backend frontend

          for attempt in $(seq 1 12); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null \
              && curl -fsS http://127.0.0.1:8001/ >/dev/null; then
              echo "TestoraQuiz deployment and health checks passed."
              exit 0
            fi

            echo "Waiting for TestoraQuiz endpoints..."
            sleep 5
          done

          echo "ERROR: TestoraQuiz health checks failed."
          docker compose logs --tail=80 backend frontend
          exit 1
          REMOTE
